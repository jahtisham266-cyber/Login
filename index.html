<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background-image:
        linear-gradient(rgba(0, 0, 0, 0.35),
                        rgba(0, 0, 0, 0.35)),
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7");

    background-size: cover;
    background-position: center;

    font-family: Arial, sans-serif;
}

/* Login Glass Box */
.login-box {
    width: 340px;
    padding: 45px 25px;

    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);

    border-radius: 20px;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);

    color: white;
}

/* Heading */
.login-box h2 {
    text-align: center;
    margin-bottom: 25px;
}

/* Input */
.input-box {
    position: relative;
    margin-bottom: 18px;
}

.input-box input {
    width: 100%;
    height: 45px;

    padding: 0 45px 0 15px;

    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 25px;

    outline: none;

    background: rgba(255,255,255,0.08);
    color: white;
}

.input-box input::placeholder {
    color: rgba(255,255,255,0.6);
}

.input-box span {
    position: absolute;
    right: 15px;
    top: 13px;
}

/* Remember + Forgot */
.options {
    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 13px;
    margin: 25px 5px;
}

.options a {
    color: white;
    text-decoration: none;
}

.options a:hover {
    text-decoration: underline;
}

/* Button */
button {
    width: 100%;
    height: 45px;

    border: none;
    border-radius: 25px;

    background: white;
    color: #333;

    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.03);
}

/* Register */
.login-box p {
    text-align: center;
    font-size: 13px;
    margin-top: 20px;
}

.login-box p a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.login-box p a:hover {
    text-decoration: underline;
}</style>
</head>
<body>

    <div class="login-box">

        <h2>Login</h2>

        <div class="input-box">
            <input type="text" placeholder="Username">
            <span>👤</span>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
            <span>🔒</span>
        </div>

        <div class="options">
            <label>
                <input type="checkbox">
                Remember Me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Submit</button>

        <p>
            Don't have an account?
            <a href="#">Register</a>
        </p>

    </div>

</body>
</html>
